name: Build release

# Superseded by Woodpecker CI (.woodpecker/release.yaml), which now owns
# versioning and releases on push to main. The release trigger is removed so a
# release published by Woodpecker does not start this workflow as well and
# upload a second archive over the first. Kept as a manual fallback: dispatch it
# with a tag that already exists to rebuild and reattach that archive.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate metadata
        run: bun run check

      - name: Build editor assets
        run: bun run build

      - name: Package plugin
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_root="$RUNNER_TEMP/frontenda-blocks-package"
          plugin_root="$package_root/frontenda-blocks"
          archive_name="frontenda-blocks-${RELEASE_TAG}.zip"

          mkdir -p "$plugin_root"
          rsync -a ./ "$plugin_root/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='assets/src/' \
            --exclude='coverage/' \
            --exclude='*.log'

          cd "$package_root"
          zip -qr "$GITHUB_WORKSPACE/$archive_name" frontenda-blocks

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontenda-blocks-${{ inputs.tag }}
          path: frontenda-blocks-${{ inputs.tag }}.zip
          if-no-files-found: error

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "frontenda-blocks-${RELEASE_TAG}.zip" --clobber
